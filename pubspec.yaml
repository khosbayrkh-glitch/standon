name: standon_app
description: "Top-down zombie shooter game built with Flutter and Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/pistol.mp3
    - assets/audio/rifle.mp3
    - assets/audio/shotgun.mp3
    - assets/audio/sniper.mp3
    - assets/audio/reload.mp3